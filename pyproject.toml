[project]
name = "patas"
version = "0.1.0"
description = "Agente de agendamento da Patas & Cia Clínica Veterinária (MVP de portfólio)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "openai>=3.24.0",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
