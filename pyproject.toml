[project]
name = "patas"
version = "0.1.0"
description = "Agente de agendamento da Patas & Cia Clínica Veterinária (MVP de portfólio)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
